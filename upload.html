<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Song</title>
<style>body{background:#111;color:#fff;font-family:sans-serif;padding:20px;text-align:center}input,button{width:90%;padding:12px;margin:10px;border-radius:10px;border:none}button{background:#1db954;color:#fff;font-weight:bold;font-size:16px}</style></head>
<body><h2>🎵 Naresh AI - Upload Song</h2>
<input id="token" type="password" placeholder="Paste GitHub Token Here">
<input id="name" placeholder="Song Peru - ex: Naa Song">
<input id="file" type="file" accept="audio/*">
<button onclick="upload()">UPLOAD SONG</button><p id="msg"></p>
<script>
async function upload(){
let t=document.getElementById('token').value;
let n=document.getElementById('name').value;
let f=document.getElementById('file').files[0];
if(!t||!n||!f){alert('Anni fill chey mawa!');return;}
document.getElementById('msg').innerText='Uploading... Wait mawa...';
let r=new FileReader();
r.onload=async()=>{
let base64=r.result.split(',')[1];
let fname=n.replace(/\s+/g,'-')+'.mp3';
let res=await fetch('https://api.github.com/repos/nareshvalmiki9390-cmd/-naresh-ai-songs-/contents/songs/'+fname,{method:'PUT',headers:{'Authorization':'token '+t,'Content-Type':'application/json'},body:JSON.stringify({message:'New song '+n,content:base64})});
if(res.ok){document.getElementById('msg').innerText='✅ Upload Aypoyindi! App lo 2 mins lo vastundi!';}
else{document.getElementById('msg').innerText='❌ Error! Token check chey mawa!';}
};
r.readAsDataURL(f);
}
</script></body></html>
